<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#051b22" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@200;300;400;500;600;700&amp;display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@100;200;300;400;500;700;900&amp;display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,slnt,wdth,wght,GRAD,ROND@6..144,-10..0,25..151,1..1000,0..100,0..100&amp;display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Google+Sans:100,200,300,400,500,600,700" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bruno+Ace+SC&amp;display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&amp;display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&amp;display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="frame" id="frame">
    <main class="stage" id="stage" aria-label="2025 De'Von Achane football statistics infographic">
      <div class="haze" aria-hidden="true"></div>
      <div class="corner-streak streak-tl" aria-hidden="true"></div>
      <div class="corner-streak streak-br" aria-hidden="true"></div>
      <div class="lightline line-a" aria-hidden="true"></div>
      <div class="lightline line-b" aria-hidden="true"></div>
      <img class="player" src="assets/achane-cutout.png" alt="De'Von Achane in his Miami Dolphins number 28 uniform" />
      <div class="photo-fade" aria-hidden="true"></div>
      <img class="team-logo" src="assets/dolphins-logo.png" alt="Miami Dolphins" />
      <h1 class="headline"><span class="name-first-A">DE</span><span class="name-first-B">VON</span><span class="name-last-A">AC</span><span class="name-last-B">H</span><span class="name-last-C">ANE</span></h1>
      <div class="headline-rule"></div>
      <div class="season-flag"><span>2025 STAT RANKINGS</span></div>
      <div class="flag-spark spark-left" aria-hidden="true"></div>
      <div class="flag-spark spark-right" aria-hidden="true"></div>
      <section class="stats" id="stats" aria-label="2025 running back rankings"></section>
      <div class="nameplate"><div class="nameplate-inner"><div class="jersey-number"><span class="pos">RB</span><span class="num">#28</span></div><div class="player-label">DEVON<span class="last-name">ACHANE</span></div></div></div>
      <section class="takeaway"><div class="takeaway-inner">
        <div class="takeaway-title"><span>THE</span><br><span class="second">TAKEAWAY</span><span class="chevrons">»</span></div>
        <div class="takeaway-separator"></div>
        <div class="takeaway-copy">Elite efficiency and explosiveness on the ground (<strong class="rank-inline rank-1">RB1</strong> in YPC, YCO/A, and EXPLSV%),<br>and elite impact in the passing game (<strong class="rank-inline rank-5">RB5</strong> in targets, <strong class="rank-inline rank-3">RB3</strong> in target share, <strong class="rank-inline rank-4">RB4</strong> in receiving yards).</div>
      </div></section>
    </main>
  </div>
</body>
</html>
